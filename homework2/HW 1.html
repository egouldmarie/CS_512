<body>
  <h2>WebGL</h2>
  <p>Edit vertex and fragment shaders on the left, and you can see the result on the right instantly. <br>
    Please copy your edits to the source code if you want to save them, as the playground doesn't save them to the file.
  </p>

  <div style="display: flex; gap: 10px; align-items: flex-start;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div>
        <b>Vertex Shader</b><br>
        <textarea id="vsEditor"></textarea>
      </div>
      <div>
        <b>Fragment Shader</b><br>
        <textarea id="fsEditor"></textarea>
      </div>
    </div>

    <div>
      <canvas id="glcanvas" width="600" height="600"></canvas>
    </div>
  </div>

  <!-- MAKE SURE YOU UPDATE YOUR EDITS HERE -->
  <!-- Vertex Shader -->
  <script id="vertex-shader" type="x-shader/x-vertex">#version 300 es
  in float aIndex;
  in vec3 aPosition;
  in vec3 aColor;

  uniform float uCount; //total number of vertices
  uniform float uTime; //time in sec
  out vec3 vColor;

  void main() {
    float scale = 0.5;
    float t = (uTime/2.+aIndex/uCount) - floor(uTime/2.+aIndex/uCount);
    if(t<0.5) scale += t;
    else scale += 1.-t;

    gl_Position = vec4(scale*aPosition, 1.0);
    vColor = aColor;
  }
  </script>

  <!-- MAKE SURE YOU UPDATE YOUR EDITS HERE -->
  <!-- Fragment Shader -->
  <script id="fragment-shader" type="x-shader/x-fragment">#version 300 es
  precision highp float;
  in vec3 vColor;

  uniform float uTime; //time in sec

  out vec4 fragColor;

  void main() {
    float scale = 0.5;
    float t = uTime/2. - floor(uTime/2.);
    if(t<0.5) scale += t;
    else scale += 1.-t;

    vec3 color = scale*vColor + (1. -scale)*vColor.zxy;

    fragColor = vec4(color, 1.0);
  }
  </script>

  <script src="triangle.js"></script>

  <script>
    function createShader(gl, type, source) {
      let shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    function createProgram(gl, vsSource, fsSource) {
      let vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
      let fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
      let prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(prog));
      }
      return prog;
    }


    // --- WebGL init ---
    const canvas = document.getElementById("glcanvas");
    // const gl = canvas.getContext("webgl2");
    const gl = canvas.getContext("webgl2", { premultipliedAlpha: false });
    if (!gl) alert("WebGL2 not supported");

    //alpha transparency
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);


    const vsEditor = document.getElementById("vsEditor");
    const fsEditor = document.getElementById("fsEditor");
    vsEditor.value = document.getElementById("vertex-shader").textContent;
    fsEditor.value = document.getElementById("fragment-shader").textContent;

    let program, posLoc, indexLoc, colorLoc, timeLoc, countLoc;
    let posBuffer, indexBuffer, colorBuffer;

    // --- Buffers ---
    function initBuffers() {
      posBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

      colorBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, colors, gl.STATIC_DRAW);

      indexBuffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, indexBuffer);
      gl.bufferData(gl.ARRAY_BUFFER, indices, gl.STATIC_DRAW);
    }

    initBuffers();

    function initShaderProgram() {
      try {
        program = createProgram(gl, vsEditor.value, fsEditor.value);
        gl.useProgram(program);
        posLoc = gl.getAttribLocation(program, "aPosition");
        colorLoc = gl.getAttribLocation(program, "aColor");
        indexLoc = gl.getAttribLocation(program, "aIndex");
        timeLoc = gl.getUniformLocation(program, "uTime");
        countLoc = gl.getUniformLocation(program, "uCount");
      } catch (e) { console.error(e); }
    }

    initShaderProgram();

    //hot compile when any input in the playground text area
    vsEditor.onkeyup = initShaderProgram;
    fsEditor.onkeyup = initShaderProgram;

    let startTime = Date.now();
    function render() {
      //clear the canvas
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.enable(gl.DEPTH_TEST);

      // Position buffer binding
      gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
      gl.enableVertexAttribArray(posLoc);
      gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);

      // Color buffer binding
      gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
      gl.enableVertexAttribArray(colorLoc);
      gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 0, 0);

      // Index buffer binding
      gl.bindBuffer(gl.ARRAY_BUFFER, indexBuffer);
      gl.enableVertexAttribArray(indexLoc);
      gl.vertexAttribPointer(indexLoc, 1, gl.FLOAT, false, 0, 0);

      //delta time in ms
      let deltaTime = Date.now() - startTime;
      //set time in seconds
      gl.uniform1f(timeLoc, deltaTime/1000.0);

      //set vertex count
      gl.uniform1f(countLoc, 3.);

      // Draw content
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    // Initialize when page loads
    window.onload = function () {
      setInterval(render, 30);
    };
  </script>
